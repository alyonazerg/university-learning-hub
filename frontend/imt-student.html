<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой IMT</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="imt-idiom.css"></head><body><main id="imt"><a href="learning.html">← Learning Hub</a><section class="imt-card"><h1>Мой IMT</h1><p>Загрузите свой список идиом в PDF, CSV или XLSX.</p><input id="file" type="file" accept=".pdf,.csv,.xlsx,.xlsm"><button id="upload">Загрузить IMT</button><p id="status" role="status"></p></section></main><script src="config.js"></script><script>upload.onclick=async()=>{const f=file.files[0],t=sessionStorage.getItem('moon_access_token');if(!f||!t){status.textContent='Войдите в Learning Hub и выберите файл.';return}const fd=new FormData();fd.append('file',f);status.textContent='Распознаём…';const r=await fetch((window.MOON_CAMPUS_API_BASE||'https://api.mooncampus.ru')+'/learning/imt/my/upload',{method:'POST',headers:{Authorization:'Bearer '+t},body:fd});const d=await r.json();status.textContent=r.ok?'Материал принят. После проверки появятся задания.':(d.detail||'Ошибка загрузки')};</script></body></html>
