<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Campus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="mark">✦</div>

    <h1>Moon Campus</h1>
    <p>Создай учебный профиль и выбери свой магический псевдоним.</p>

    <section class="alias-card">
      <div class="alias-label">Твой псевдоним</div>
      <div id="pseudonym" class="alias-name"></div>

      <button class="refresh" type="button" onclick="generateAlias()">
        ↻ Другой псевдоним
      </button>
    </section>

    <button class="continue" type="button">
      Продолжить
    </button>
  </main>

  <script>
    const firstWords = [
      "Moon", "Silver", "Lunar", "Mystic",
      "Star", "Aurora", "Dream", "Velvet",
      "Secret", "Crystal", "Twilight", "Golden"
    ];

    const secondWords = [
      "Willow", "Fox", "Bloom", "Sage",
      "Raven", "Fern", "Comet", "Thyme",
      "Owl", "Rose", "Maple", "Cloud"
    ];

    function generateAlias() {
      const used = JSON.parse(localStorage.getItem("usedAliases") || "[]");
      const allAliases = [];

      firstWords.forEach(first => {
        secondWords.forEach(second => {
          allAliases.push(`${first} ${second}`);
        });
      });

      const available = allAliases.filter(alias => !used.includes(alias));
      const pool = available.length > 0 ? available : allAliases;
      const alias = pool[Math.floor(Math.random() * pool.length)];

      if (!used.includes(alias)) {
        used.push(alias);
        localStorage.setItem("usedAliases", JSON.stringify(used));
      }

      document.getElementById("pseudonym").textContent = alias;
    }

    generateAlias();
  </script>
</body>
</html>
