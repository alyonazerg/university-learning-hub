<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Campus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="mark">✦</div>
    <h1>Moon Campus</h1>
    <p>Создай учебный профиль и выбери псевдоним.</p>

    <section class="alias-card">
      <p class="alias-label">Твой псевдоним</p>
      <div id="pseudonym" class="alias-name"></div>
      <button class="refresh" type="button" onclick="generateAlias()">
        Сгенерировать другой
      </button>
    </section>

    <button type="button">Продолжить</button>
  </main>

  <script>
    const aliases = [
      "MoonFox", "LunarBloom", "StarMage",
      "NightOwl", "SilverLeaf", "CosmicQuill",
      "MysticFern", "AuroraWolf", "MoonSage"
    ];

    function generateAlias() {
      const alias = aliases[Math.floor(Math.random() * aliases.length)];
      document.getElementById("pseudonym").textContent = alias;
    }

    generateAlias();
  </script>
</body>
</html>
