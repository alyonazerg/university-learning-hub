<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261011">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f1fb">
  <title>Moon Campus · Learning profile</title>
  <link rel="stylesheet" href="styles.css?v=20261014-02">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="config.js" defer></script>
  <script src="registration.js?v=20261012-05" defer></script>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="mark" aria-hidden="true">✦</div>
    <div class="eyebrow">Your learning universe</div>
    <h1 id="page-title">Moon Campus</h1>
    <p>Your profile starts with a little magic. Choose an alias you like.</p>
    <section class="alias-card" aria-labelledby="alias-label">
      <div id="alias-label" class="alias-label">Your alias</div>
      <div id="pseudonym" class="alias-name" aria-live="polite" aria-atomic="true">Choosing…</div>
      <button id="refresh" class="alias-refresh" type="button"><span aria-hidden="true">↻</span><span>Another alias</span></button>
    </section>
    <p class="privacy">Your learning profile uses an alias. Your real name is not required.</p>
    <button id="continue" class="continue" type="button" disabled>Create profile</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="status"><a class="home-login-button" href="learning.html">Student sign in →</a></p>
    <p class="status"><a class="home-login-button" href="teacher-login.html">Teacher sign in →</a></p>
    <noscript><p class="status">Enable JavaScript to choose an alias.</p></noscript>
  </main>
</body>
</html>
