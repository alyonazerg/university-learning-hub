<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f1fb">
  <title>Moon Campus · Учебный профиль</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="config.js" defer></script>
  <script src="registration.js" defer></script>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="mark" aria-hidden="true">✦</div>
    <div class="eyebrow">Твоя учебная вселенная</div>
    <h1 id="page-title">Moon Campus</h1>
    <p>Твой профиль начинается с маленькой магии. Выбери псевдоним, который тебе нравится.</p>
    <section class="alias-card" aria-labelledby="alias-label">
      <div id="alias-label" class="alias-label">Твой псевдоним</div>
      <div id="pseudonym" class="alias-name" aria-live="polite" aria-atomic="true">Выбираем…</div>
      <button id="refresh" class="refresh" type="button">↻ Другой псевдоним</button>
    </section>
    <p class="privacy">В учебном пространстве тебя будут видеть под псевдонимом. Имя и фамилия здесь не нужны.</p>
    <button id="continue" class="continue" type="button" disabled>Создать профиль</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="status"><a href="admin.html">Кабинет преподавателя · демо →</a></p>
    <noscript><p class="status">Включи JavaScript, чтобы выбрать псевдоним.</p></noscript>
  </main>
</body>
</html>
