<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Campus · Вход преподавателя</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="imt-idiom.css"></head><body><main id="imt"><section class="imt-card"><p class="eyebrow">Moon Campus</p><h1>Вход преподавателя</h1><p id="status">Введите логин и пароль.</p><form id="login"><label>Логин<input id="user" required autocomplete="username"></label><label>Пароль<input id="pass" type="password" required autocomplete="current-password"></label><button>Войти в Teacher Hub</button></form></section></main><script src="config.js"></script><script>const b=window.MOON_CAMPUS_API_BASE||'https://api.mooncampus.ru';login.onsubmit=async e=>{e.preventDefault();status.textContent='Входим…';const r=await fetch(b+'/learning/login/teacher',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:user.value,password:pass.value})});const d=await r.json();if(!r.ok){status.textContent=d.detail||'Ошибка входа';return}localStorage.setItem('moon_access_token',d.access_token);location.href='admin.html'};</script></body></html>
