<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Campus · Teacher sign in</title><link rel="stylesheet" href="styles.css"><script src="bug-report.js?v=20261014-01" defer></script></head><body><main class="entry-card"><a class="back-link" href="index.html">← Back to Moon Campus</a><div class="mark" aria-hidden="true">✦</div><div class="eyebrow">Moon Campus</div><h1>Teacher sign in</h1><p id="status">Enter your teacher login and password.</p><form id="login"><label>Username<input id="user" required autocomplete="username"></label><label>Password<input id="pass" type="password" required autocomplete="current-password"></label><button class="entry-button" type="submit">Sign in to Teacher Hub</button></form></main><script src="config.js"></script><script>login.onsubmit=async e=>{e.preventDefault();status.textContent='Signing in…';const r=await fetch((window.MOON_CAMPUS_API_BASE||'https://api.mooncampus.ru')+'/learning/login/teacher',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:user.value,password:pass.value})});const d=await r.json();if(!r.ok){status.textContent=d.detail||'Could not sign in';return}sessionStorage.setItem('moon-learning-session:'+(window.MOON_CAMPUS_API_BASE||'https://api.mooncampus.ru').replace(/\/$/,''),JSON.stringify({token:d.access_token,expires_at:Date.now()+d.expires_in*1000}));location.href='learning.html'};</script></body></html>
